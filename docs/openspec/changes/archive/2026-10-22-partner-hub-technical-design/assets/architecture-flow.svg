<text x="1603" y="1150" font-size="24" fill="#556d84" font-weight="400" text-anchor="start">只扫异常 / 待重试任务</text>
<text x="1603" y="1186" font-size="24" fill="#556d84" font-weight="400" text-anchor="start">有限重试 / 租约恢复 / 人工</text>
