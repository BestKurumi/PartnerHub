<text x="1603" y="921" font-size="22" fill="#556d84" font-weight="400" text-anchor="start">MySQL 提交确认后才 ACCEPTED</text>
<text x="1603" y="957" font-size="23" fill="#556d84" font-weight="400" text-anchor="start">临时失败 202；永久失败转人工</text>
