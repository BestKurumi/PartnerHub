<text x="80" y="1398" font-size="28" fill="#2563a6" font-weight="600" text-anchor="start">06 查询与操作 · MySQL 唯一查询来源</text>
<text x="80" y="1442" font-size="25" fill="#556d84" font-weight="400" text-anchor="start">按 msgId 查状态；中台运维查失败 / 尝试 / 人工重试。正常成功记录未归档时，暂无记录 ≠ 未投递。</text>
<text x="80" y="1483" font-size="24" fill="#556d84" font-weight="400" text-anchor="start">客户通知展示属于右侧外部 Mock；Redis 只缓存关系与暂存归档，不作为重试权威。</text>
<path d="M1275 1350 V1235" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#a-teal)" stroke-dasharray="9 7" />
<text x="55" y="1570" font-size="22" fill="#556d84" font-weight="400" text-anchor="start">蓝：首发主线　绿虚线：异步记录 / 查询　橙：绑定或异常恢复｜已移除成交入口 Kafka，仍保留绑定和平台 2 输出 Kafka。</text>
