<text x="1003" y="571" font-size="23" fill="#556d84" font-weight="400" text-anchor="start">固定平台 UID / 目标</text>
<text x="1003" y="607" font-size="23" fill="#556d84" font-weight="400" text-anchor="start">不经全量任务扫库</text>
