<path d="M1960 1150 H1980 V380 H1655 V478 H1690" fill="none" stroke="#ad6218" stroke-width="3" marker-end="url(#a-orange)" stroke-dasharray="9 7" />
<text x="1610" y="1268" font-size="21" fill="#ad6218" font-weight="500" text-anchor="start">恢复也调用 05；成功记录永不领取</text>
