<text x="363" y="535" font-size="23" fill="#556d84" font-weight="400" text-anchor="start">限流 / 并发 / 校验</text>
<text x="363" y="571" font-size="23" fill="#556d84" font-weight="400" text-anchor="start">等待首次尝试结果</text>
<text x="363" y="607" font-size="23" fill="#556d84" font-weight="400" text-anchor="start">沿用 msgId，返回首轮结果 200 / 202</text>
