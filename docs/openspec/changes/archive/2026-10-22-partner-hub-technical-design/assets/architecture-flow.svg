<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1610" viewBox="0 0 2400 1610" role="img" aria-labelledby="title desc">
<title id="title">外部合作中台 · 直接首发与MySQL异常恢复</title><desc id="desc">HTTP直接路由及分平台首发，不做成交业务防重；正常结果Redis暂存后异步写MySQL，失败事务提交后才确认接管，MySQL驱动重试及状态查询。绑定事件和平台2输出Kafka保留，成交入口Kafka移除。</desc>
<defs><marker id="a-ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#17314d" /></marker><marker id="a-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#556d84" /></marker><marker id="a-line" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#cbd8e5" /></marker><marker id="a-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#2563a6" /></marker><marker id="a-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#087f83" /></marker><marker id="a-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#ad6218" /></marker><marker id="a-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#7150a0" /></marker></defs>
