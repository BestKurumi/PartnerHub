<text x="55" y="65" font-size="40" fill="#17314d" font-weight="600" text-anchor="start">外部合作中台 · 直接首发与异常恢复</text>
<text x="55" y="110" font-size="26" fill="#556d84" font-weight="400" text-anchor="start">设计 v2.0｜上游保证不重复；正常异步归档；失败接管先落 MySQL；上游与运维状态查询只读 MySQL</text>
