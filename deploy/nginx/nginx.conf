worker_processes 2;
worker_rlimit_nofile 4096;
events {
    worker_connections 1024;
}
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 3s;
    client_header_timeout 2s;
    keepalive_timeout 30s;
    send_timeout 10s;
    limit_conn_zone $server_name zone=connections:1m;
    resolver 127.0.0.11 valid=3s ipv6=off;
    # Both instances are explicit peers; no DNS-based approximation.
    upstream hub_backend {
        zone hub_backend 64k;
        server hub-1:8080 resolve max_conns=64 max_fails=1 fail_timeout=3s;
        server hub-2:8080 resolve max_conns=64 max_fails=1 fail_timeout=3s;
        keepalive 32;
    }
    upstream platform1_backend {
        zone platform1_backend 64k;
        server mock-platform1:18081 resolve;
        keepalive 8;
    }
    upstream platform2_backend {
        zone platform2_backend 64k;
        server mock-platform2:18082 resolve;
        keepalive 8;
    }
    # No automatic replay, including POST when a backend response is uncertain.
    proxy_next_upstream off;
    proxy_connect_timeout 1s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    server {
        listen 80;
        server_name localhost;
        limit_conn connections 128;
        limit_conn_status 429;
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
        location /mock/p1/ { proxy_pass http://platform1_backend; }
        location /mock/p2/ { proxy_pass http://platform2_backend; }
        # Diagnostics fanout is container-to-container with its own token.
        # Public requests must only reach the authenticated ops API.
        location /internal/ { return 404; }
        # Resolve the upstream mock lazily: it starts after this proxy is healthy.
        location /mock/upstream/ {
            resolver 127.0.0.11 valid=3s ipv6=off;
            set $upstream_mock http://mock-upstream:18083;
            proxy_pass $upstream_mock;
            proxy_read_timeout 40s;
        }
        location / { proxy_pass http://hub_backend; }
    }
}
